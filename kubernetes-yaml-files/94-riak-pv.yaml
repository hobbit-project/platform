apiVersion: v1
kind: PersistentVolume
metadata:
    name: riaktest-pv
spec:
    capacity:
        storage: 2Gi
    accessModes:
        - ReadWriteOnce
    persistentVolumeReclaimPolicy:  Delete #, depending on your needs
    storageClassName: "" # Important: Leave this empty if not using Storage Classes
    nfs:
        server: 131.234.29.64
        path: /data/nfs/kubedata/riaktest
