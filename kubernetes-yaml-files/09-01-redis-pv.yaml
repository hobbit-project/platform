apiVersion: v1
kind: PersistentVolume
metadata:
    name: redis-pv
spec:
    capacity:
        storage: 1Gi
    accessModes:
        - ReadWriteOnce
    persistentVolumeReclaimPolicy: Retain # Or Delete, as needed
    storageClassName: "" # Important: Leave empty if not using Storage Classes
    nfs:
        server: 131.234.29.64
        path: /data/nfs/kubedata/redis
