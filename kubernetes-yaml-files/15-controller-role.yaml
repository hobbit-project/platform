apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: node-pod-service-reader
    namespace: default
rules:
    - apiGroups: [""]
      resources: ["nodes", "pods", "services", "namespaces"]
      verbs: ["create", "get", "update", "delete", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: controller-service-account-binding
    namespace: default
subjects:
    - kind: ServiceAccount
      name: controller-service-sa
      namespace: default
roleRef:
    kind: Role
    name: node-pod-service-reader
    apiGroup: rbac.authorization.k8s.io
