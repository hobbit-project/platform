apiVersion: apps/v1
kind: Deployment
metadata:
    name: rabbitmq
    labels:
        app: rabbitmq
spec:
    replicas: 1
    selector:
        matchLabels:
            app: rabbitmq
    template:
        metadata:
            labels:
                app: rabbitmq
        spec:
            containers:
                - name: rabbitmq
                  image: rabbitmq:3-management
                  securityContext:
                      runAsUser: 79184 # Replace with the actual numeric user ID
                      runAsGroup: 10000
                  ports:
                      - containerPort: 5672  # AMQP protocol (for applications)
                      - containerPort: 15672 # Management UI (for admins)
                  env:
                      - name: RABBITMQ_DEFAULT_USER
                        value: "guest"
                      - name: RABBITMQ_DEFAULT_PASS
                        value: "guest"
                  volumeMounts:
                      - mountPath: /var/lib/rabbitmq
                        name: rabbitmq-storage
            initContainers:
                - name: configure-rabbitmq
                  image: busybox
                  command: ['sh', '-c', 'echo "loopback_users.guest = false" > /etc/rabbitmq/rabbitmq.conf']
                  volumeMounts:
                      - mountPath: /etc/rabbitmq
                        name: rabbitmq-config
            volumes:
                - name: rabbitmq-storage
                  persistentVolumeClaim:
                      claimName: rabbitmq-pvc
                - name: rabbitmq-config
                  emptyDir: {}
