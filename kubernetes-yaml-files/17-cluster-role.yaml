apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: node-reader
rules:
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch"]  # Minimum permissions needed

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: controller-service-account-binding
subjects:
    - kind: ServiceAccount
      name: controller-service-sa
      namespace: default
roleRef:
    kind: ClusterRole
    name: node-reader
    apiGroup: rbac.authorization.k8s.io
